<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сравнивай цены - покупай выгодно</title>
    
    <!-- ПОДКЛЮЧЕНИЕ СТИЛЕЙ -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="index-page">
    <div class="theme-toggle-container">
        <button id="themeToggle" class="theme-toggle" aria-label="Переключить тему">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0 0 20 10 10 0 0 0 0-20zm0 2a8 8 0 0 1 8 8 8 8 0 0 1-8 8 8 8 0 0 1-8-8 8 8 0 0 1 8-8zm0 11a1 1 0 0 0 1-1v-4a1 1 0 0 0-2 0v4a1 1 0 0 0 1 1zm0-7a1 1 0 0 0-1 1v4a1 1 0 0 0 2 0v-4a1 1 0 0 0-1-1z"/></svg>
        </button>
    </div>

    <div class="hero-container">
        <h1>Сравнивай цены — покупай выгодно</h1>
        <p>Находи лучшие цены на нужные товары в ближайших магазинах и онлайн</p>
        <div class="buttons-group">
            <a href="login.html" class="cta-button btn-outline">Войти</a>
            <a href="login.html" class="cta-button btn-primary">Регистрация</a>
        </div>
    </div>


    <section class="reviews-section" aria-labelledby="reviews-title">
        <div class="reviews-heading">
            <span class="reviews-kicker">ВАШЕ МНЕНИЕ ВАЖНО</span>
            <h2 id="reviews-title">Отзывы о приложении</h2>
            <p>Расскажите, что вам понравилось и что можно улучшить.</p>
        </div>
        <form id="reviewForm" class="review-form">
            <div class="review-fields">
                <label>Ваше имя
                    <input id="reviewName" type="text" maxlength="40" placeholder="Например, Анастасия" required>
                </label>
                <label>Оценка
                    <select id="reviewRating" required>
                        <option value="5">★★★★★ — Отлично</option>
                        <option value="4">★★★★☆ — Хорошо</option>
                        <option value="3">★★★☆☆ — Нормально</option>
                        <option value="2">★★☆☆☆ — Есть проблемы</option>
                        <option value="1">★☆☆☆☆ — Плохо</option>
                    </select>
                </label>
            </div>
            <label>Ваш отзыв
                <textarea id="reviewText" rows="3" maxlength="600" placeholder="Поделитесь впечатлениями…" required></textarea>
            </label>
            <button class="cta-button btn-primary review-submit" type="submit">Оставить отзыв</button>
            <p id="reviewNotice" class="review-notice" role="status"></p>
        </form>
        <div id="reviewsList" class="reviews-list" aria-live="polite"></div>
    </section>

    <script>
        // Переключение темы
        const themeToggle = document.getElementById('themeToggle');
        const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)');

        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && prefersDarkScheme.matches)) {
            document.body.classList.add('dark-theme');
        }

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            const icon = themeToggle.querySelector('svg');
            icon.style.transform = 'rotate(180deg)';
            setTimeout(() => { icon.style.transform = 'rotate(0deg)'; }, 300);
            localStorage.setItem('theme', document.body.classList.contains('dark-theme') ? 'dark' : 'light');
        });

        // Отзывы сохраняются в этом браузере.
        const reviewForm = document.getElementById('reviewForm');
        const reviewsList = document.getElementById('reviewsList');
        const reviewNotice = document.getElementById('reviewNotice');
        const reviewsKey = 'sravnivai_app_reviews';

        function readReviews() {
            try { return JSON.parse(localStorage.getItem(reviewsKey) || '[]'); }
            catch { return []; }
        }
        function renderReviews() {
            const reviews = readReviews();
            reviewsList.replaceChildren();
            if (!reviews.length) {
                const empty = document.createElement('p');
                empty.className = 'reviews-empty';
                empty.textContent = 'Пока нет отзывов. Будьте первым!';
                reviewsList.appendChild(empty);
                return;
            }
            reviews.slice().reverse().forEach(review => {
                const card = document.createElement('article');
                card.className = 'review-card';
                const top = document.createElement('div');
                top.className = 'review-card-top';
                const name = document.createElement('strong');
                name.textContent = review.name;
                const rating = document.createElement('span');
                rating.className = 'review-stars';
                rating.textContent = '★'.repeat(review.rating) + '☆'.repeat(5 - review.rating);
                const date = document.createElement('small');
                date.textContent = review.date;
                const body = document.createElement('p');
                body.textContent = review.text;
                top.append(name, rating);
                card.append(top, body, date);
                reviewsList.appendChild(card);
            });
        }
        reviewForm.addEventListener('submit', event => {
            event.preventDefault();
            const name = document.getElementById('reviewName').value.trim();
            const text = document.getElementById('reviewText').value.trim();
            const rating = Number(document.getElementById('reviewRating').value);
            if (!name || !text) return;
            const reviews = readReviews();
            reviews.push({ name, text, rating, date: new Date().toLocaleDateString('ru-RU') });
            localStorage.setItem(reviewsKey, JSON.stringify(reviews));
            reviewForm.reset();
            reviewNotice.textContent = 'Спасибо! Ваш отзыв добавлен.';
            renderReviews();
        });
        renderReviews();
    </script>
</body>
</html>
