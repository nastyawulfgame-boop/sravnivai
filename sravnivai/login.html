<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .auth-container {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            animation: fadeInUp 0.5s ease-out forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Переключатель вкладок */
        .tabs-nav {
            display: flex;
            gap: 1px;
            background-color: #e9ecef;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }

        .tab-btn {
            flex: 1;
            padding: 14px;
            border: none;
            background: transparent;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
        }

        .tab-btn.active {
            background-color: white;
            color: #3498db;
            box-shadow: inset 0 -2px 0 #3498db;
        }

        .tab-btn:hover:not(.active) {
            background-color: #dee2e6;
        }

        h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #2c3e50;
            font-size: 1.5rem;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        .form-group {
            margin-bottom: 1.2rem;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #555;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e8ed;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        button[type="submit"] {
            padding: 14px;
            background-color: #3498db;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            margin-top: 0.5rem;
        }

        button[type="submit"]:hover:not(:disabled) {
            background-color: #2980b9;
            transform: translateY(-2px);
        }

        button[type="submit"]:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            color: #e74c3c;
            font-size: 0.85rem;
            height: 1em;
            margin-top: 0.3rem;
            visibility: hidden;
        }

        .error-message.active {
            visibility: visible;
        }

        footer {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
            color: #718096;
        }

        a {
            color: #3498db;
            text-decoration: none;
            font-weight: 500;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Тёмная тема */
        body.dark-theme {
            background-color: #1a202c;
            color: #d2dae2;
        }

        body.dark-theme .auth-container {
            background: #2d3748;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }

        body.dark-theme h2 {
            color: #f7fafc;
        }

        body.dark-theme input {
            background-color: #4a5568;
            color: #fff;
            border-color: #66788e;
        }

        body.dark-theme input::placeholder {
            color: #cbd5e0;
        }

        body.dark-theme .form-group label {
            color: #d2dae2;
        }

        body.dark-theme .tabs-nav {
            background-color: #4a5568;
        }

        body.dark-theme .tab-btn {
            color: #d2dae2;
        }

        body.dark-theme .tab-btn.active {
            background-color: #2d3748;
            color: #3498db;
        }
            .page-nav { position: fixed; top: 18px; left: 18px; display:flex; gap:10px; z-index:5; }
        .page-nav a { text-decoration:none; color:#3498db; background:#fff; padding:10px 14px; border-radius:999px; box-shadow:0 4px 14px rgba(0,0,0,.08); font-size:14px; font-weight:600; }
        .page-nav a:hover { background:#edf6fc; }
        @media(max-width:520px) { .page-nav { top:10px; left:10px; } .page-nav a { padding:8px 10px; font-size:12px; } .auth-container { margin-top:55px; } }

        /* Обновлённый цветной дизайн страницы входа для ПК */
        body {
            background: radial-gradient(circle at 12% 15%, rgba(255, 117, 180, .22), transparent 30%),
                        radial-gradient(circle at 88% 82%, rgba(91, 108, 255, .24), transparent 32%),
                        linear-gradient(135deg, #f5f3ff 0%, #fdf2f8 52%, #eef2ff 100%);
        }
        .auth-container {
            max-width: 460px;
            padding: 2.4rem;
            border: 1px solid rgba(255,255,255,.85);
            border-radius: 24px;
            box-shadow: 0 24px 70px rgba(75, 55, 130, .16);
        }
        .tabs-nav {
            background: #f0edff;
            padding: 5px;
            gap: 5px;
            border-radius: 14px;
        }
        .tab-btn { border-radius: 10px; color: #6b6480; }
        .tab-btn.active {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: #fff;
            box-shadow: 0 5px 14px rgba(124, 58, 237, .24);
        }
        .tab-btn:hover:not(.active) { background: #e4ddff; }
        h2 { color: #312653; }
        label { color: #51476d; }
        input {
            border: 1.5px solid #e5def7;
            border-radius: 12px;
            background: #fdfcff;
        }
        input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, .14);
        }
        button[type="submit"] {
            background: linear-gradient(110deg, #7c3aed, #a855f7 55%, #ec4899);
            border-radius: 12px;
            box-shadow: 0 9px 22px rgba(124, 58, 237, .2);
        }
        button[type="submit"]:hover:not(:disabled) {
            background: linear-gradient(110deg, #6d28d9, #9333ea 55%, #db2777);
            box-shadow: 0 12px 26px rgba(124, 58, 237, .27);
        }
        body.dark-theme {
            background: radial-gradient(circle at 12% 15%, rgba(168, 85, 247, .16), transparent 30%), #171329;
        }
        body.dark-theme .auth-container {
            border-color: #35294d;
            box-shadow: 0 24px 70px rgba(0,0,0,.35);
        }
        body.dark-theme h2 { color: #f3eaff; }
        body.dark-theme label { color: #d8ccec; }
        body.dark-theme input { background: #211a33; border-color: #45345e; color: #fff; }
        body.dark-theme .tabs-nav { background: #211a33; }
        body.dark-theme .tab-btn.active { color: #fff; }
        @media (min-width: 1000px) {
            .auth-container { transform: translateY(0); }
        }

    </style>
</head>
<body>
    <nav class="page-nav" aria-label="Навигация"><a href="tovari.html">Главная</a><a href="tovari.html">Каталог товаров</a></nav>
    <div class="auth-container">
        <!-- Навигация по формам -->
        <div class="tabs-nav">
            <button type="button" id="loginTab" class="tab-btn active">Войти</button>
            <button type="button" id="registerTab" class="tab-btn">Регистрация</button>
        </div>

        <h2 id="formTitle">Вход в аккаунт</h2>
        
        <form id="authForm" autocomplete="off" novalidate>
            
            <!-- Поле "Имя". По умолчанию скрыто, показывается только при регистрации -->
            <div class="form-group" id="nameGroup" style="display: none;">
                <label for="name">Ваше имя</label>
                <input type="text" id="name" name="name" placeholder="Например, Иван" required minlength="2">
                <div class="error-message" id="nameError"></div>
            </div>

            <div class="form-group">
                <label for="email">Email или логин</label>
                <input type="text" id="email" name="email" placeholder="Введите данные" required>
                <div class="error-message" id="emailError"></div>
            </div>
            
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="Введите пароль" required minlength="6">
                <div class="error-message" id="passwordError"></div>
            </div>

            <!-- Поле подтверждения пароля. Показывается только при регистрации -->
            <div class="form-group" id="confirmGroup" style="display: none;">
                <label for="confirmPassword">Подтвердите пароль</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Повторите пароль" required minlength="6">
                <div class="error-message" id="confirmError"></div>
            </div>

            <button type="submit" id="submitBtn">Войти</button>
        </form>

        <footer id="toggleFooter">
            <span id="footerText">Нет аккаунта? <a href="#" id="switchLink">Создать аккаунт</a></span>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');
            const authForm = document.getElementById('authForm');
            const submitBtn = document.getElementById('submitBtn');
            const formTitle = document.getElementById('formTitle');
            const toggleFooter = document.getElementById('toggleFooter');
            const switchLink = document.getElementById('switchLink');
            const footerText = document.getElementById('footerText');

            // Поля формы
            const nameInput = document.getElementById('name');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const confirmInput = document.getElementById('confirmPassword');

            // Блоки ошибок
            const nameError = document.getElementById('nameError');
            const emailError = document.getElementById('emailError');
            const passwordError = document.getElementById('passwordError');
            const confirmError = document.getElementById('confirmError');

            let isLoginMode = true;

            function showLogin() {
                isLoginMode = true;
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
                
                formTitle.textContent = 'Вход в аккаунт';
                submitBtn.textContent = 'Войти';
                
                document.getElementById('nameGroup').style.display = 'none';
                document.getElementById('confirmGroup').style.display = 'none';
                
                toggleFooter.innerHTML = 'Нет аккаунта? <a href="#" id="switchLink">Создать аккаунт</a>';
                updateSwitchLink();
                
                clearAllErrors();
            }

            function showRegister() {
                isLoginMode = false;
                registerTab.classList.add('active');
                loginTab.classList.remove('active');
                
                formTitle.textContent = 'Создание аккаунта';
                submitBtn.textContent = 'Создать аккаунт';
                
                document.getElementById('nameGroup').style.display = 'block';
                document.getElementById('confirmGroup').style.display = 'block';
                
                toggleFooter.innerHTML = 'Уже есть аккаунт? <a href="#" id="switchLink">Войти</a>';
                updateSwitchLink();
                
                clearAllErrors();
            }

            function updateSwitchLink() {
                switchLink.addEventListener('click', function(e) {
                    e.preventDefault();
                    if (isLoginMode) {
                        showRegister();
                    } else {
                        showLogin();
                    }
                }, { once: true });
            }

            loginTab.addEventListener('click', showLogin);
            registerTab.addEventListener('click', showRegister);

            function showError(input, message, errorDiv) {
                input.style.borderColor = '#e74c3c';
                errorDiv.textContent = message;
                errorDiv.classList.add('active');
            }

            function clearError(input, errorDiv) {
                input.style.borderColor = '#e1e8ed';
                errorDiv.textContent = '';
                errorDiv.classList.remove('active');
            }

            function clearAllErrors() {
                [emailInput, passwordInput, confirmInput, nameInput].forEach(i => i.style.borderColor = '#e1e8ed');
                [emailError, passwordError, confirmError, nameError].forEach(e => e.classList.remove('active'));
            }

            authForm.addEventListener('submit', function(event) {
                event.preventDefault();
                clearAllErrors();
                let isValid = true;

                if (!isLoginMode && nameInput.value.trim().length < 2) {
                    showError(nameInput, 'Имя должно содержать не менее 2 символов', nameError);
                    isValid = false;
                }

                if (emailInput.value.trim().indexOf('@') === -1 || emailInput.value.trim().length < 3) {
                    showError(emailInput, 'Введите корректный Email', emailError);
                    isValid = false;
                }

                if (passwordInput.value.length < 6) {
                    showError(passwordInput, 'Не менее 6 символов', passwordError);
                    isValid = false;
                }

                if (!isLoginMode) {
                    if (confirmInput.value !== passwordInput.value) {
                        showError(confirmInput, 'Пароли не совпадают', confirmError);
                        isValid = false;
                    }
                }

                if (isValid) {
                    submitBtn.disabled = true;
                    submitBtn.textContent = isLoginMode ? 'Проверка...' : 'Создание...';

                    setTimeout(() => {
                        if (isLoginMode) {
                            // После успешного входа открываем каталог товаров
                            window.location.href = 'tovari.html';
                            return;
                        }

                        alert(`Аккаунт создан!\nДанные:\nEmail: ${emailInput.value}`);
                        authForm.reset();
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Создать аккаунт';
                    }, 1500);
                }
            });

            // Очистка ошибок при вводе
            [emailInput, passwordInput, confirmInput, nameInput].forEach(input => {
                input.addEventListener('input', () => clearError(input, 
                    input.id === 'email' ? emailError :
                    input.id === 'password' ? passwordError :
                    input.id === 'confirmPassword' ? confirmError : nameError));
            });

            // Инициализация первого состояния
            updateSwitchLink();
        });
    </script>
</body>
</html>
