<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .auth-container {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            animation: fadeInUp 0.5s ease-out forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Переключатель вкладок */
        .tabs-nav {
            display: flex;
            gap: 1px;
            background-color: #e9ecef;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }

        .tab-btn {
            flex: 1;
            padding: 14px;
            border: none;
            background: transparent;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
        }

        .tab-btn.active {
            background-color: white;
            color: #3498db;
            box-shadow: inset 0 -2px 0 #3498db;
        }

        .tab-btn:hover:not(.active) {
            background-color: #dee2e6;
        }

        h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #2c3e50;
            font-size: 1.5rem;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        .form-group {
            margin-bottom: 1.2rem;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #555;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e8ed;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        button[type="submit"] {
            padding: 14px;
            background-color: #3498db;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            margin-top: 0.5rem;
        }

        button[type="submit"]:hover:not(:disabled) {
            background-color: #2980b9;
            transform: translateY(-2px);
        }

        button[type="submit"]:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            color: #e74c3c;
            font-size: 0.85rem;
            height: 1em;
            margin-top: 0.3rem;
            visibility: hidden;
        }

        .error-message.active {
            visibility: visible;
        }

        footer {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
            color: #718096;
        }

        a {
            color: #3498db;
            text-decoration: none;
            font-weight: 500;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Тёмная тема */
        body.dark-theme {
            background-color: #1a202c;
            color: #d2dae2;
        }

        body.dark-theme .auth-container {
            background: #2d3748;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }

        body.dark-theme h2 {
            color: #f7fafc;
        }

        body.dark-theme input {
            background-color: #4a5568;
            color: #fff;
            border-color: #66788e;
        }

        body.dark-theme input::placeholder {
            color: #cbd5e0;
        }

        body.dark-theme .form-group label {
            color: #d2dae2;
        }

        body.dark-theme .tabs-nav {
            background-color: #4a5568;
        }

        body.dark-theme .tab-btn {
            color: #d2dae2;
        }

        body.dark-theme .tab-btn.active {
            background-color: #2d3748;
            color: #3498db;
        }
        @media(max-width:520px) { .auth-container { margin:16px; } }
    </style>
</head>
<body>
    <div class="auth-container">
        <!-- Навигация по формам -->
        <div class="tabs-nav">
            <button type="button" id="loginTab" class="tab-btn active">Войти</button>
            <button type="button" id="registerTab" class="tab-btn">Регистрация</button>
        </div>

        <h2 id="formTitle">Вход в аккаунт</h2>
        
        <form id="authForm" autocomplete="off" novalidate>
            
            <!-- Поле "Имя". По умолчанию скрыто, показывается только при регистрации -->
            <div class="form-group" id="nameGroup" style="display: none;">
                <label for="name">Ваше имя</label>
                <input type="text" id="name" name="name" placeholder="Например, Иван" required minlength="2">
                <div class="error-message" id="nameError"></div>
            </div>

            <div class="form-group">
                <label for="email">Email или логин</label>
                <input type="text" id="email" name="email" placeholder="Введите данные" required>
                <div class="error-message" id="emailError"></div>
            </div>
            
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="Введите пароль" required minlength="6">
                <div class="error-message" id="passwordError"></div>
            </div>

            <!-- Поле подтверждения пароля. Показывается только при регистрации -->
            <div class="form-group" id="confirmGroup" style="display: none;">
                <label for="confirmPassword">Подтвердите пароль</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Повторите пароль" required minlength="6">
                <div class="error-message" id="confirmError"></div>
            </div>

            <button type="submit" id="submitBtn">Войти</button>
        </form>

        <footer id="toggleFooter">
            <span id="footerText">Нет аккаунта? <a href="#" id="switchLink">Создать аккаунт</a></span>
        </footer>
    </div>

    <script src="auth/auth.js"></script>
</body>
</html>
